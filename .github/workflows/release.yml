name: Release package

on:
  push:
    tags:
      - "*-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: packages/pi-memory/models
          key: memory-model-${{ hashFiles('scripts/fetch-memory-model.mjs') }}
      - run: node scripts/fetch-memory-model.mjs
      - run: npm run release:check

      - name: Resolve package-scoped tag
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          SLUG="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          FILE="packages/${SLUG}/package.json"
          test -f "$FILE" || { echo "::error::Unknown package slug ${SLUG}"; exit 1; }
          NAME="$(node -p "require('./${FILE}').name")"
          EXPECTED="$(node -p "require('./${FILE}').version")"
          test "$VERSION" = "$EXPECTED" || { echo "::error::Tag ${VERSION} != ${NAME} package version ${EXPECTED}"; exit 1; }
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-package.mjs '${{ steps.package.outputs.name }}' "$RUNNER_TEMP"
          TGZ="$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print | sort | tail -n1)"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.package.outputs.name }} ${{ steps.package.outputs.version }}" \
            --generate-notes \
            "${{ steps.pack.outputs.tgz }}"

      - name: Publish to npm with OIDC
        env:
          RELEASE_PACKAGE: ${{ steps.package.outputs.name }}
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npm run release:publish
